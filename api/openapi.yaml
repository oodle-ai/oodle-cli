      properties:
        data:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/EvaluationRuleResponse'
    ListEvaluatorsResponse:
      type: object
      description: |-
        ListEvaluatorsResponse is the evaluator list envelope. It
        includes both Oodle-managed evaluator templates and the ones
        defined in this instance.
      required:
        - data
