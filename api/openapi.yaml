        data:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/EvalTemplate'
        meta:
          $ref: '#/components/schemas/ListMeta'
    ListInvitationsResponse:
      type: object
      description: |-
        ListInvitationsResponse is the response for listing
        invitations.
      required:
        - invitations
      properties:
        invitations:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/UserInvitation'
    ListJobsResponse:
      type: object
      description: ListJobsResponse is the job list envelope.
      required:
        - data
        - meta
      properties:
        data:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Job'
        meta:
          $ref: '#/components/schemas/ListMeta'
    ListLLMConnectionsResponse:
      type: object
      description: |-
        ListLLMConnectionsResponse is the connection list. Stored
        API keys are never included.
      required:
        - data
      properties:
        data:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/LLMConnection'
    ListMeta:
      type: object
      description: |-
        ListMeta is the pagination envelope every llmops list
        endpoint returns alongside `data`.
      required:
        - totalItems
        - page
        - limit
      properties:
        limit:
          type: integer
        page:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
    ListPromptVersionsResponse:
      type: object
      description: ListPromptVersionsResponse is the per-name version list.
      required:
        - data
        - meta
      properties:
        data:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/PromptResponse'
        meta:
          $ref: '#/components/schemas/ListMeta'
    ListPromptsResponse:
      type: object
      description: ListPromptsResponse is the prompt list envelope.
      required:
        - data
        - meta
      properties:
        data:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/PromptMetaResponse'
        meta:
          $ref: '#/components/schemas/ListMeta'
    ListRolesResponse:
      type: object
      description: |-
        ListRolesResponse is the response for listing available
        user roles.
      required:
        - roles
      properties:
        roles:
          type: array
          nullable: true
          items:
            type: string
    ListScoresResponse:
      type: object
      description: ListScoresResponse is the score list envelope.
      required:
        - data
        - meta
      properties:
        data:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ScoreResponse'
        meta:
          $ref: '#/components/schemas/ListMeta'
    ListSyntheticMonitorsResponse:
      type: object
      description: |-
        ListSyntheticMonitorsResponse is the response body for listing synthetic
        monitors.
      required:
        - monitors
        - total
      properties:
        monitors:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/SyntheticMonitor'
        total:
          type: integer
    ListUsersResponse:
      type: object
      description: ListUsersResponse is the response for listing users.
      required:
        - users
      properties:
        users:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/User'
    LogFilter:
      type: object
      description: 'LogFilter is a union type that can be one of: match (simple field matching), all (all filters must match), any (at least one filter must match), or not (negation of a filter). Filters can be nested recursively.'
      properties:
        all:
          type: array
          description: All filters must match (AND). Each item is a LogFilter.
          minItems: 1
          items:
            type: object
            description: Nested LogFilter (recursive). Same structure as the parent LogFilter.
        any:
          type: array
          description: At least one filter must match (OR). Each item is a LogFilter.
          minItems: 1
          items:
            type: object
            description: Nested LogFilter (recursive). Same structure as the parent LogFilter.
        match:
          type: object
          required:
            - field
            - operator
          properties:
            field:
              type: string
            jsonPath:
              type: string
              nullable: true
            operator:
              type: string
              enum:
                - is
                - contains
                - matches regex
                - exists
            value:
              type: string
              nullable: true
        not:
          type: object
          description: Nested LogFilter (recursive). Same structure as the parent LogFilter.
    LogMetrics:
      type: object
      description: LogMetrics is a definition to convert logs to metrics.
      properties:
        filter:
          $ref: '#/components/schemas/LogFilter'
        id:
          type: string
          format: uuid
          description: ID is the unique identifier.
          readOnly: true
        labels:
          type: array
          description: |-
            Labels are the labels that will be added to all metrics created
            by this configuration.
          nullable: true
          items:
            $ref: '#/components/schemas/Label'
        metricDefinitions:
          type: array
          description: MetricDefinitions defines all the metrics to be created from the logs.
          nullable: true
          items:
            $ref: '#/components/schemas/MetricDefinition'
        name:
          type: string
          description: Name is the name of the rule.
        updatedAtEpochMs:
          type: integer
          description: UpdatedAtEpochMs is the updated at time in milliseconds since epoch.
    LogsQueryResponse:
      type: object
      properties:
        responses:
          type: array
          items:
            $ref: '#/components/schemas/LogsSearchResult'
        took:
          type: integer
          format: int64
          description: Total time in milliseconds
    LogsSearchResult:
      type: object
      properties:
        aggregations:
          type: object
          description: Aggregation results, if requested
        hits:
          type: object
          properties:
            hits:
              type: array
              items:
                type: object
                properties:
                  _source:
                    type: object
                    description: Log document fields
                  sort:
                    type: array
                    items: {}
            total:
              type: object
              properties:
                relation:
                  type: string
                value:
                  type: integer
                  format: int64
        status:
          type: integer
          description: HTTP status code for this search
        timed_out:
          type: boolean
        took:
          type: integer
          format: int64
    Lookup:
      type: object
      description: Lookup specifies how to look up a value in a lookup/enrichment table.
      properties:
        fallback:
          $ref: '#/components/schemas/LookupFallback'
        matchColumn:
          type: string
          description: MatchColumn is the column name in the lookup table to match against.
        tableId:
          type: string
          description: TableID is the ID of the lookup table to use.
        valueColumn:
          type: string
          description: ValueColumn is the column name in the lookup table to get the value from.
    LookupFallback:
      type: object
      description: LookupFallback specifies a fallback value source when a lookup fails.
      properties:
        field:
          type: string
          description: Field is the name of the log field to use as the fallback value.
    MSTeamsV2Config:
      type: object
      required:
        - send_resolved
      properties:
        http_config:
          $ref: '#/components/schemas/HTTPClientConfig'
        send_resolved:
          type: boolean
        text:
          type: string
        title:
          type: string
        webhook_url:
          type: string
    MatchType:
      type: integer
      description: |-
        Type of label matcher. Values:
        - 0: Equals (=)
        - 1: Not equals (!=)
        - 2: Regular expression match (=~)
        - 3: Regular expression not match (!~)
      enum:
        - 0
        - 1
        - 2
        - 3
    MetricDefinition:
      type: object
      description: MetricDefinition represents the definition of a metric to be created.
      properties:
        field:
          type: string
          description: |-
            Field is the name of the log field to extract from. Only used when Type is
            "counter" or "gauge".
        jsonPath:
          type: string
          description: |-
            JSONPath is an optional JSON path to extract a numeric value from a JSON field.
            Only used when Type is "counter" or "gauge". Cannot be used together with Regex.
          nullable: true
        name:
          type: string
          description: |-
            Name is the name of the metric to be created. Must match Prometheus metric naming rules.
            See https://prometheus.io/docs/concepts/data_model/#metric-names-and-labels
        regex:
          type: string
          description: |-
            Regex is an optional regex pattern to extract a numeric value from the field.
            Only used when Type is "counter" or "gauge". Cannot be used together with JSONPath.
          nullable: true
        type:
          $ref: '#/components/schemas/MetricType'
    MetricLabelMatcher:
      type: object
      description: Matcher specifies a rule, which can match or set of labels or not.
      properties:
        name:
          type: string
        type:
          type: integer
        value:
          type: string
    MetricType:
      type: string
      description: |-
        Type of metric to be created. Values:
        - 0: Count of logs
        - 1: Counter metric
        - 2: Gauge metric
        - 3: Histogram metric
      enum:
        - log_count
        - counter
        - gauge
        - histogram
    Monitor:
      type: object
      description: Monitor is a model for a monitor.
      required:
        - name
        - promql_query
      properties:
        annotations:
          type: object
          description: Annotations are the annotations for the monitor.
          nullable: true
          additionalProperties:
            type: string
        conditions:
          $ref: '#/components/schemas/ConditionBySeverity'
        group_interval:
          type: string
          format: duration
          description: GroupInterval is the interval at which to send alerts for the same group of alerts after the first alert.
        group_wait:
          type: string
          format: duration
          description: GroupWait is the time to wait before sending the first alert for a group of alerts.
        grouping:
          $ref: '#/components/schemas/Grouping'
        id:
          type: string
          format: uuid
          readOnly: true
        interval:
          type: string
          format: duration
          description: Interval is the interval at which the monitor should be evaluated.
        label_matcher_notification_policies:
          type: array
          description: |-
            Deprecated: LabelMatcherNotificationPolicies is the list of label matcher notification policies for the monitor.
            These policies are evaluated in order, and the first matching policy is used.
            If no policy matches, the default NotificationPolicyID is used if set.
          nullable: true
          deprecated: true
          items:
            $ref: '#/components/schemas/LabelMatcherNotifications'
        labels:
          type: object
          description: Labels are the labels for the monitor.
          nullable: true
          additionalProperties:
            type: string
        name:
          type: string
          description: Name is the name of the monitor.
        notification_policy_id:
          type: string
          format: uuid
          description: |-
            Deprecated: NotificationPolicyID is the ID of the notification policy associated with the monitor.
            It is an optional field.
          nullable: true
          deprecated: true
        notifications:
          type: array
          description: |-
            Notifications is the list of notifications for the monitor.
            These notifications are evaluated in order, and the first matching notification is used.
          nullable: true
          items:
            $ref: '#/components/schemas/LabelMatcherNotifications'
        promql_query:
          type: string
          description: PromQLQuery is the Prometheus query for the monitor.
        repeat_interval:
          type: string
          format: duration
          description: |-
            RepeatInterval is the interval at which to send alerts for the same alert after firing.
            RepeatInterval should be a multiple of GroupInterval
        updated_at_epoch_ms:
          type: integer
          description: UpdatedAtEpochMs is the updated at time in milliseconds since epoch.
          readOnly: true
    MonitorState:
      type: object
      description: MonitorState represents the state of a monitor.
      required:
        - id
        - last_evaluation
        - evaluation_time
        - health
        - history
      properties:
        evaluation_time:
          type: number
        health:
          type: string
        history:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/MonitorTriggerInstance'
        id:
          type: string
          format: uuid
        last_evaluation:
          type: string
          format: date-time
    MonitorTrigger:
      type: object
      description: |-
        MonitorTrigger represents a monitor that triggers an alert.

        JSON field names use camelCase (monitorID, startsAt, endsAt, updatedAt) for
        historical reasons - most other Oodle API schemas use snake_case. The
        camelCase casing is preserved here to avoid breaking existing HTTP clients
        that depend on the current field names. New schemas should use snake_case.
      required:
        - startsAt
        - endsAt
        - monitorID
        - severity
        - updatedAt
        - labels
      properties:
        endsAt:
          type: string
          format: date-time
        labels:
          type: object
          nullable: true
          additionalProperties:
            type: string
        monitorID:
          type: string
        severity:
          type: string
        startsAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MonitorTriggerInstance:
      type: object
      description: MonitorTriggerInstance is an instance of a firing monitor.
      required:
        - monitor_id
        - starts_at
        - severity
      properties:
        FiringInstanceLastActiveTime:
          type: string
          format: date-time
          description: Used to track the last active time for a firing instance
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        monitor_id:
          type: string
        severity:
          type: string
        starts_at:
          type: string
          format: date-time
    MutingRule:
      type: object
      description: |-
        MutingRule allows to mute notifications.
        When ScheduleIDs is non-empty, this is a recurring muting rule.
        When ScheduleIDs is empty, this is a one-off muting rule.
      required:
        - id
        - matchers
      properties:
        comment:
          type: string
          description: 'Optional: Comment can be used to additional note along with the muting rule.'
        createdAt:
          type: string
          format: date-time
          description: CreatedAt is the creation timestamp for the muting rules. May be empty.
        createdBy:
          type: string
          description: 'Optional: CreatedBy is the user who created the muting rule.'
        endsAt:
          type: string
          format: date-time
          description: 'Optional: EndsAt is the end time when muting ends. If not specified, then muting is effective forever. Only for one-off rules.'
        id:
          type: string
        matchers:
          type: array
          description: |-
            Matchers is the list of matchers that determine when this rule applies.
            An alert instance is muted if it matches all the matchers.
          nullable: true
          items:
            $ref: '#/components/schemas/LabelMatcher'
        name:
          type: string
          description: 'Optional: Name is a human-readable name for the muting rule.'
        scheduleIds:
          type: array
          description: |-
            Optional: ScheduleIDs is a list of schedule UUIDs. When non-empty, the rule is recurring
            and mutually exclusive with StartsAt/EndsAt. The alert is muted during ANY of the referenced schedules.
          nullable: true
          items:
            type: string
        schedules:
          type: array
          description: Schedules is populated on read with the full schedule objects for each ScheduleID.
          nullable: true
          items:
            $ref: '#/components/schemas/Schedule'
        startsAt:
          type: string
          format: date-time
          description: 'Optional: StartsAt is the start time when muting starts. Defaults to current time. Only for one-off rules.'
        updatedAt:
          type: string
          format: date-time
          description: UpdatedAt is the timestamp of the last update of the muting rule.
    NotificationPolicy:
      type: object
      description: |-
        NotificationPolicy represents a policy for sending notifications based on severity.
        A notification policy is associated with a monitor.
      properties:
        global:
          type: boolean
          description: Global policy is applied to all monitors in addition to any monitor specific policies.
        id:
          type: string
          format: uuid
          readOnly: true
        mute_global:
          type: boolean
        mute_non_global:
          type: boolean
          description: |-
            MuteNonGlobal is used to disable all non-global policies. It can only be set for a Global
            notification policy. Global policy would still be effective when MuteNonGlobal is true.
        name:
          type: string
        notifiers:
          $ref: '#/components/schemas/NotifiersByCondition'
        updated_at_epoch_ms:
          type: integer
          description: UpdatedAtEpochMs is the updated at time in milliseconds since epoch.
          readOnly: true
    Notifier:
      type: object
      description: Notifier represents a single notification target.
      required:
        - type
      properties:
        email_config:
          $ref: '#/components/schemas/EmailConfig'
        googlechat_config:
          $ref: '#/components/schemas/GoogleChatConfig'
        id:
          type: string
          format: uuid
          readOnly: true
        msteamsv2_config:
          $ref: '#/components/schemas/MSTeamsV2Config'
        name:
          type: string
        opsgenie_config:
          $ref: '#/components/schemas/OpsGenieConfig'
        pagerduty_config:
          $ref: '#/components/schemas/PagerdutyConfig'
        rootly_config:
          $ref: '#/components/schemas/WebhookConfig'
        slack_config:
          $ref: '#/components/schemas/SlackConfig'
        type:
          type: integer
        updated_at_epoch_ms:
          type: integer
          description: UpdatedAtEpochMs is the updated at time in milliseconds since epoch.
        webhook_config:
          $ref: '#/components/schemas/WebhookConfig'
    NotifiersByCondition:
      type: object
      description: NotifiersByCondition represents notifiers for each severity level.
      properties:
        any:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
        critical:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
        no_data:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
        warn:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
    OAuth2:
      type: object
      description: OAuth2 is the oauth2 client configuration.
      required:
        - client_id
        - token_url
      properties:
        TLSConfig:
          $ref: '#/components/schemas/TLSConfig'
        client_id:
          type: string
        client_secret:
          type: string
        client_secret_file:
          type: string
        client_secret_ref:
          type: string
          description: |-
            ClientSecretRef is the name of the secret within the secret manager to use as the client
            secret.
        endpoint_params:
          type: object
          nullable: true
          additionalProperties:
            type: string
        no_proxy:
          type: string
          description: NoProxy contains addresses that should not use a proxy.
        proxy_connect_header:
          type: object
          description: |-
            ProxyConnectHeader optionally specifies headers to send to
            proxies during CONNECT requests. Assume that at least _some_ of
            these headers are going to contain secrets and use Secret as the
            value type instead of string.
          nullable: true
          additionalProperties:
            type: array
            nullable: true
            items:
              type: string
        proxy_from_environment:
          type: boolean
          description: |-
            ProxyFromEnvironment makes use of net/http ProxyFromEnvironment function
            to determine proxies.
        scopes:
          type: array
          nullable: true
          items:
            type: string
        token_url:
          type: string
    OpsGenieConfig:
      type: object
      description: OpsGenieConfig configures notifications via OpsGenie.
      required:
        - send_resolved
      properties:
        actions:
          type: string
        api_key:
          type: string
        api_url:
          $ref: '#/components/schemas/URL'
        description:
          type: string
        details:
          type: object
          nullable: true
          additionalProperties:
            type: string
        entity:
          type: string
        http_config:
          $ref: '#/components/schemas/HTTPClientConfig'
        message:
          type: string
        note:
          type: string
        priority:
          type: string
        responders:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/OpsGenieConfigResponder'
        send_resolved:
          type: boolean
        source:
          type: string
        tags:
          type: string
        update_alerts:
          type: boolean
    OpsGenieConfigResponder:
      type: object
      properties:
        id:
          type: string
          description: One of those 3 should be filled.
        name:
          type: string
        type:
          type: string
          description: team, user, escalation, schedule etc.
        username:
          type: string
    PagerdutyConfig:
      type: object
      description: PagerdutyConfig configures notifications via PagerDuty.
      required:
        - send_resolved
      properties:
        class:
          type: string
        client:
          type: string
        client_url:
          type: string
        component:
          type: string
        description:
          type: string
        details:
          type: object
          nullable: true
          additionalProperties:
            type: string
        group:
          type: string
        http_config:
          $ref: '#/components/schemas/HTTPClientConfig'
        images:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/PagerdutyImage'
        links:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/PagerdutyLink'
        routing_key:
          type: string
        routing_key_file:
          type: string
        send_resolved:
          type: boolean
        service_key:
          type: string
        severity:
          type: string
        source:
          type: string
        url:
          $ref: '#/components/schemas/URL'
    PagerdutyImage:
      type: object
      description: PagerdutyImage is an image.
      properties:
        alt:
          type: string
        href:
          type: string
        src:
          type: string
    PagerdutyLink:
      type: object
      description: PagerdutyLink is a link.
      properties:
        href:
          type: string
        text:
          type: string
    PatchIntegration:
      type: object
      properties:
        status:
          type: string
        type:
          type: string
        typeSpecificData:
          oneOf:
            - $ref: '#/components/schemas/CloudWatchMetricPullIntegrationWrapper'
            - $ref: '#/components/schemas/ConfluentCloudIntegrationWrapper'
            - type: object
              description: Type-specific config for integration variants not yet typed in this spec (Grafana, GCP, CloudWatch dashboard, S3 log pull). Shape depends on the parent `type` field; consult the backend models for the variant in use.
              additionalProperties: true
    PrometheusQueryResponse:
      type: object
      required:
        - status
      properties:
        data:
          type: object
          properties:
            result:
              type: array
              items:
                type: object
                description: Series result. Shape depends on resultType.
            resultType:
              type: string
              enum:
                - matrix
                - vector
                - scalar
                - string
        error:
          type: string
        errorType:
          type: string
        status:
          type: string
          enum:
            - success
            - error
        warnings:
          type: array
          items:
            type: string
    PromptMetaResponse:
      type: object
      description: |-
        PromptMetaResponse is the per-name rollup returned by the
        prompt list endpoint — one entry per prompt name, not per
        version.
      required:
        - name
        - versions
        - labels
        - tags
        - type
        - lastUpdatedAt
        - lastConfig
      properties:
        labels:
          type: array
          nullable: true
          items:
            type: string
        lastConfig: {}
        lastUpdatedAt:
          type: string
        name:
          type: string
        tags:
          type: array
          nullable: true
          items:
            type: string
        type:
          type: string
        versions:
          type: array
          nullable: true
          items:
            type: integer
    PromptResponse:
      type: object
      description: PromptResponse is a single prompt version.
      required:
        - id
        - name
        - version
        - type
      properties:
        commitMessage:
          type: string
        config: {}
        createdAt:
          type: string
        id:
          type: string
        isActive:
          type: boolean
        labels:
          type: array
          nullable: true
          items:
            type: string
        name:
          type: string
        prompt: {}
        resolutionGraph:
          type: object
          description: |-
            ResolutionGraph maps a prompt name to the prompts it
            pulled in, and is only set when `resolve` was not
            disabled and the prompt has dependency tags.
          nullable: true
          additionalProperties:
            type: array
            nullable: true
            items:
              type: string
        tags:
          type: array
          nullable: true
          items:
            type: string
        type:
          type: string
        updatedAt:
          type: string
        version:
          type: integer
    SaveDashboardRequest:
      type: object
      required:
        - dashboard
      properties:
        dashboard:
          type: object
          description: Grafana-compatible dashboard JSON
        folderUid:
          type: string
        message:
          type: string
        overwrite:
          type: boolean
    SaveDashboardResponse:
      type: object
      description: SaveDashboardResponse represents a response from saving a dashboard
      required:
        - id
        - uid
        - url
        - status
        - version
        - slug
      properties:
        id:
          type: integer
        slug:
          type: string
        status:
          type: string
        uid:
          type: string
        url:
          type: string
        version:
          type: integer
    Schedule:
      type: object
      description: Schedule represents a named recurring mute timing.
      required:
        - id
        - name
        - time_intervals
        - created_at
        - updated_at
      properties:
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        id:
          type: string
        name:
          type: string
        time_intervals:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ScheduleTimeInterval'
        updated_at:
          type: string
          format: date-time
    ScheduleTimeInterval:
      type: object
      description: |-
        ScheduleTimeInterval defines a recurring time window for muting.
        YAML tags match Alertmanager's timeinterval.TimeInterval
        so the struct can be directly marshalled for AM config.
      properties:
        days_of_month:
          type: array
          nullable: true
          items:
            type: string
        location:
          type: string
        months:
          type: array
          nullable: true
          items:
            type: string
        times:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ScheduleTimeRange'
        weekdays:
          type: array
          nullable: true
          items:
            type: string
        years:
          type: array
          nullable: true
          items:
            type: string
    ScheduleTimeRange:
      type: object
      description: ScheduleTimeRange represents a time-of-day range in HH:MM format.
      required:
        - start_time
        - end_time
      properties:
        end_time:
          type: string
        start_time:
          type: string
    Score:
      type: object
      required:
        - id
        - traceId
        - name
        - dataType
        - source
        - createdAt
        - updatedAt
      properties:
        comment:
          type: string
        configId:
          type: string
        createdAt:
          type: string
        dataType:
          type: string
        environment:
          type: string
        id:
          type: string
        inputTokens:
          type: integer
        model:
          type: string
        name:
          type: string
        observationId:
          type: string
        outputTokens:
          type: integer
        source:
          type: string
        stringValue:
          type: string
        traceId:
          type: string
        updatedAt:
          type: string
        value:
          type: number
          nullable: true
    ScoreResponse:
      type: object
      description: ScoreResponse is one recorded score.
      required:
        - id
        - traceId
        - name
        - dataType
        - source
      properties:
        comment:
          type: string
        configId:
          type: string
        createdAt:
          type: string
        dataType:
          type: string
        environment:
          type: string
        errorClass:
          type: string
        errorMessage:
          type: string
        errorType:
          type: string
        evaluatorName:
          type: string
        id:
          type: string
        inputTokens:
          type: integer
        model:
          type: string
        name:
          type: string
        observationId:
          type: string
        outputTokens:
          type: integer
        permanent:
          type: boolean
        source:
          type: string
        status:
          type: string
          description: |-
            Failure fields. Status is "error" on a run that
            produced no score and empty otherwise, so callers
            that predate this can keep ignoring all of it.
        stringValue:
          type: string
        traceId:
          type: string
        updatedAt:
          type: string
        value:
          type: number
          nullable: true
    SendInvitationRequest:
      type: object
      description: |-
        SendInvitationRequest is the request body for sending
        a single organization invitation.
      required:
        - email
        - roles
        - sender_email
      properties:
        email:
          type: string
        roles:
          type: array
          nullable: true
          items:
            type: string
        sender_email:
          type: string
    SlackAction:
      type: object
      description: |-
        SlackAction configures a single Slack action that is sent with each notification.
        See https://api.slack.com/docs/message-attachments#action_fields and https://api.slack.com/docs/message-buttons
        for more information.
      properties:
        confirm:
          $ref: '#/components/schemas/SlackConfirmationField'
        name:
          type: string
        style:
          type: string
        text:
          type: string
        type:
          type: string
        url:
          type: string
        value:
          type: string
    SlackConfig:
      type: object
      description: SlackConfig configures notifications via Slack.
      required:
        - send_resolved
      properties:
        actions:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/SlackAction'
        api_url:
          type: string
        callback_id:
          type: string
        channel:
          type: string
          description: 'Slack channel override, (like #other-channel or @username).'
        color:
          type: string
        fallback:
          type: string
        fields:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/SlackField'
        footer:
          type: string
        http_config:
          $ref: '#/components/schemas/HTTPClientConfig'
        icon_emoji:
          type: string
        icon_url:
          type: string
        image_url:
          type: string
        link_names:
          type: boolean
        mrkdwn_in:
          type: array
          nullable: true
          items:
            type: string
        pretext:
          type: string
        send_resolved:
          type: boolean
        short_fields:
          type: boolean
        text:
          type: string
        thumb_url:
          type: string
        title:
          type: string
        title_link:
          type: string
        username:
          type: string
    SlackConfirmationField:
      type: object
      description: |-
        SlackConfirmationField protect users from destructive actions or particularly distinguished decisions
        by asking them to confirm their button click one more time.
        See https://api.slack.com/docs/interactive-message-field-guide#confirmation_fields for more information.
      properties:
        dismiss_text:
          type: string
        ok_text:
          type: string
        text:
          type: string
        title:
          type: string
    SlackField:
      type: object
      description: |-
        SlackField configures a single Slack field that is sent with each notification.
        Each field must contain a title, value, and optionally, a boolean value to indicate if the field
        is short enough to be displayed next to other fields designated as short.
        See https://api.slack.com/docs/message-attachments#fields for more information.
      properties:
        short:
          type: boolean
          nullable: true
        title:
          type: string
        value:
          type: string
    SyntheticCheckResult:
      type: object
      description: CheckResult represents the result of a synthetic check
      required:
        - success
        - timestamp
        - duration
        - duration_ms
      properties:
        avg_rtt_ms:
          type: number
        dns_results:
          type: array
          description: DNS-specific results
          nullable: true
          items:
            type: string
        duration:
          type: string
          format: duration
        duration_ms:
          type: integer
        error_message:
          type: string
        hops:
          type: array
          description: Traceroute-specific results
          nullable: true
          items:
            $ref: '#/components/schemas/SyntheticTracerouteHop'
        location:
          type: string
        max_rtt_ms:
          type: number
        min_rtt_ms:
          type: number
        packet_loss:
          type: number
        packets_received:
          type: integer
        packets_sent:
          type: integer
          description: Ping-specific results
        pod_id:
          type: string
        request_headers:
          type: object
          description: HTTP headers
          nullable: true
          additionalProperties:
            type: string
        response_body:
          type: string
        response_headers:
          type: object
          nullable: true
          additionalProperties:
            type: string
        ssl_expiry:
          type: string
          format: date-time
          description: SSL-specific results
          nullable: true
        status_code:
          type: integer
        step_results:
          type: array
          description: |-
            Multistep-specific results: one entry per executed step
            in chain order. The overall Success above is "all required
            steps passed".
          nullable: true
          items:
            $ref: '#/components/schemas/SyntheticStepResult'
        success:
          type: boolean
        timestamp:
          type: string
          format: date-time
    SyntheticCondition:
      type: object
      description: Condition defines alert conditions
      required:
        - op
        - value
      properties:
        for:
          type: string
          format: duration
        keep_firing_for:
          type: string
          format: duration
        op:
          type: string
        value:
          type: number
    SyntheticConditionBySeverity:
      type: object
      description: ConditionBySeverity defines conditions for each severity level
      properties:
        critical:
          $ref: '#/components/schemas/SyntheticCondition'
        warn:
          $ref: '#/components/schemas/SyntheticCondition'
    SyntheticDNSRuleConfig:
      type: object
      description: DNSRuleConfig is the configuration for DNS checks
      required:
        - domain
        - record_type
        - expect_resolution
      properties:
        domain:
          type: string
        expect_resolution:
          type: boolean
        expected_values:
          type: array
          nullable: true
          items:
            type: string
        nameserver:
          type: string
        record_type:
          type: string
    SyntheticExtractRule:
      type: object
      description: |-
        ExtractRule pulls a value from a step's response into a
        named variable.
      required:
        - name
        - source
        - parser
        - query
      properties:
        name:
          type: string
        parser:
          type: string
          description: 'Parser: "jsonpath", "regex", or "header_value".'
        query:
          type: string
          description: |-
            Query is the JSONPath, regex (first capture group),
            or header name to read.
        secret:
          type: boolean
          description: |-
            Secret marks the value as redacted in CheckResult,
            StepResult, and log output. It does NOT affect storage:
            the rule_config itself is stored as plain JSONB, matching
            the existing BearerToken / BasicAuth convention.
        source:
          type: string
          description: 'Source: "body" or "header".'
    SyntheticHTTPRuleConfig:
      type: object
      required:
        - url
        - method
      properties:
        bearer_token:
          type: string
        body:
          type: string
        excluded_status_codes:
          type: array
          items:
            description: Status code (number like 200) or pattern (string like "2XX")
        expected_body:
          type: string
        expected_headers:
          type: object
          additionalProperties:
            type: string
        expected_status_codes:
          type: array
          items:
            description: Status code (number like 200) or pattern (string like "2XX")
        follow_redirects:
          type: boolean
        headers:
          type: object
          additionalProperties:
            type: string
        insecure_skip_verify:
          type: boolean
        max_response_time_ms:
          type: integer
          format: int64
        method:
          type: string
        url:
          type: string
    SyntheticHTTPStep:
      type: object
      description: HTTPStep is one request in a multistep chain.
      required:
        - name
        - request
      properties:
        continue_on_failure:
          type: boolean
          description: |-
            ContinueOnFailure: if true, a failing step does not stop
            the chain. The step's failure is recorded but later steps
            still run and the overall monitor can still pass.
        exit_on_success:
          type: boolean
          description: |-
            ExitOnSuccess: if true, a successful step ends the chain
            early. The overall monitor is marked passed.
        extract:
          type: array
          description: |-
            Extract pulls values out of the response and binds them
            to variables that later steps can interpolate.
          nullable: true
          items:
            $ref: '#/components/schemas/SyntheticExtractRule'
        name:
          type: string
        request:
          $ref: '#/components/schemas/SyntheticHTTPRuleConfig'
    SyntheticLabelMatcherNotifications:
      type: object
      description: LabelMatcherNotifications defines notifications with label matching
      properties:
        notification_policy_id:
          type: string
        notifiers:
          $ref: '#/components/schemas/SyntheticNotifiersByCondition'
    SyntheticMonitor:
      type: object
      description: SyntheticMonitor represents a synthetic monitoring rule
      required:
        - instance
        - name
        - enabled
        - rule_type
        - rule_config
        - interval
        - timeout
      properties:
        agent_name:
          type: string
          description: |-
            AgentName is the optional name of the agent
            through which to route the check.
        annotations:
          type: object
          nullable: true
          additionalProperties:
            type: string
        conditions:
          $ref: '#/components/schemas/SyntheticConditionBySeverity'
        created_at:
          type: string
          format: date-time
        description:
          type: string
        enabled:
          type: boolean
        id:
          type: string
        instance:
          type: string
        interval:
          type: string
          format: duration
        labels:
          type: object
          nullable: true
          additionalProperties:
            type: string
        last_result:
          $ref: '#/components/schemas/SyntheticCheckResult'
        last_run_at:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
        notification_policy_id:
          type: string
        notifications:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/SyntheticLabelMatcherNotifications'
        rule_config:
          $ref: '#/components/schemas/SyntheticRuleConfig'
        rule_type:
          type: string
        timeout:
          type: string
          format: duration
        updated_at:
          type: string
          format: date-time
    SyntheticMultistepRuleConfig:
      type: object
      description: |-
        MultistepRuleConfig is the configuration for a multistep
        HTTP check. Steps execute in order; later steps can reference
        variables extracted from earlier responses via {{VAR_NAME}}
        substitution in URL, headers, and body.
      required:
        - steps
      properties:
        steps:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/SyntheticHTTPStep'
    SyntheticNotifiersByCondition:
      type: object
      description: NotifiersByCondition defines notifiers for each condition
      properties:
        any:
          type: array
          nullable: true
          items:
            type: string
        critical:
          type: array
          nullable: true
          items:
            type: string
        warn:
          type: array
          nullable: true
          items:
            type: string
    SyntheticPingRuleConfig:
      type: object
      description: PingRuleConfig is the configuration for ICMP ping checks
      required:
        - host
      properties:
        count:
          type: integer
        host:
          type: string
        interval_ms:
          type: integer
    SyntheticRuleConfig:
      type: object
      description: RuleConfig is a union type for different rule configurations
      properties:
        dns:
          $ref: '#/components/schemas/SyntheticDNSRuleConfig'
        http:
          $ref: '#/components/schemas/SyntheticHTTPRuleConfig'
        multistep:
          $ref: '#/components/schemas/SyntheticMultistepRuleConfig'
        ping:
          $ref: '#/components/schemas/SyntheticPingRuleConfig'
        ssl:
          $ref: '#/components/schemas/SyntheticSSLRuleConfig'
        tcp:
          $ref: '#/components/schemas/SyntheticTCPRuleConfig'
        traceroute:
          $ref: '#/components/schemas/SyntheticTracerouteRuleConfig'
    SyntheticSSLRuleConfig:
      type: object
      description: SSLRuleConfig is the configuration for SSL certificate checks
      required:
        - host
        - port
        - warn_days_before_expiry
        - critical_days_before_expiry
        - insecure_skip_verify
        - check_certificate_authority
      properties:
        check_certificate_authority:
          type: boolean
        critical_days_before_expiry:
          type: integer
        host:
          type: string
        insecure_skip_verify:
          type: boolean
        port:
          type: integer
        warn_days_before_expiry:
          type: integer
    SyntheticStepResult:
      type: object
      description: |-
        StepResult is the outcome of a single step in a multistep
        monitor. Per-step ResponseBody / headers are deliberately
        omitted to keep the result payload small — the run-history
        UI surfaces step name, success, status, duration, and error
        only. Secret-extracted values are scrubbed from ErrorMessage
        before this struct is populated.
      required:
        - name
        - success
        - duration_ms
      properties:
        duration_ms:
          type: integer
        error_message:
          type: string
        name:
          type: string
        status_code:
          type: integer
        success:
          type: boolean
    SyntheticTCPRuleConfig:
      type: object
      description: TCPRuleConfig is the configuration for TCP checks
      required:
        - host
        - port
      properties:
        host:
          type: string
        port:
          type: integer
    SyntheticTracerouteHop:
      type: object
      description: TracerouteHop represents a single hop in a traceroute
      required:
        - hop_number
      properties:
        address:
          type: string
        hop_number:
          type: integer
        hostname:
          type: string
        rtt_ms:
          type: number
        timeout:
          type: boolean
    SyntheticTracerouteRuleConfig:
      type: object
      description: TracerouteRuleConfig is the configuration for traceroute checks
      required:
        - host
      properties:
        host:
          type: string
        max_hops:
          type: integer
        timeout_per_hop_ms:
          type: integer
    TLSConfig:
      type: object
      description: TLSConfig configures the options for TLS connections.
      required:
        - insecure_skip_verify
      properties:
        ca:
          type: string
          description: Text of the CA cert to use for the targets.
        ca_file:
          type: string
          description: The CA cert to use for the targets.
        ca_ref:
          type: string
          description: |-
            CARef is the name of the secret within the secret manager to use as the CA cert for the
            targets.
        cert:
          type: string
          description: Text of the client cert file for the targets.
        cert_file:
          type: string
          description: The client cert file for the targets.
        cert_ref:
          type: string
          description: |-
            CertRef is the name of the secret within the secret manager to use as the client cert for
            the targets.
        insecure_skip_verify:
          type: boolean
          description: Disable target certificate validation.
        key:
          type: string
          description: Text of the client key file for the targets.
        key_file:
          type: string
          description: The client key file for the targets.
        key_ref:
          type: string
          description: |-
            KeyRef is the name of the secret within the secret manager to use as the client key for
            the targets.
        max_version:
          type: integer
          description: Maximum TLS version.
        min_version:
          type: integer
          description: Minimum TLS version.
        server_name:
          type: string
          description: Used to verify the hostname for the targets.
    Trace:
      type: object
      required:
        - traceID
        - spans
        - processes
      properties:
        processes:
          type: object
          nullable: true
          additionalProperties:
            allOf:
              - $ref: '#/components/schemas/TraceProcess'
        spans:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TraceSpan'
        traceID:
          type: string
        warnings:
          type: string
    TraceLabelsResponse:
      type: object
      required:
        - data
        - total
        - limit
        - offset
      properties:
        data:
          type: array
          nullable: true
          items:
            type: string
        errors:
          type: string
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
    TraceProcess:
      type: object
      required:
        - serviceName
        - tags
      properties:
        serviceName:
          type: string
        tags:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TraceSpanTag'
    TraceSpan:
      type: object
      required:
        - traceID
        - spanID
        - parentSpanID
        - operationName
        - startTime
        - endTime
        - duration
        - tags
        - logs
        - references
        - processID
      properties:
        duration:
          type: integer
        endTime:
          type: integer
        logs:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TraceSpanLog'
        operationName:
          type: string
        parentSpanID:
          type: string
        processID:
          type: string
        references:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TraceSpanReference'
        spanID:
          type: string
        startTime:
          type: integer
        tags:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TraceSpanTag'
        traceID:
          type: string
        warning:
          type: string
    TraceSpanLog:
      type: object
      required:
        - timestamp
        - fields
      properties:
        fields:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TraceSpanTag'
        timestamp:
          type: integer
    TraceSpanReference:
      type: object
      required:
        - refType
        - traceID
        - spanID
      properties:
        refType:
          type: string
        spanID:
          type: string
        traceID:
          type: string
    TraceSpanTag:
      type: object
      description: |-
        Tag represents a single key/value attribute attached to a Span,
        Process, or Log.

        FilterLabel is the fully-qualified storage-column name this tag was
        derived from (e.g. "span::http.method", "resource::k8s.cluster.name",
        "scope_name"). When set, clients can use it directly as a label name
        for trace filtering without having to guess which bucket (span vs
        resource) the attribute came from or which prefix to prepend.

        FilterLabel is empty for synthesised tags that don't correspond to a
        single indexed label (e.g. "otel.status_code" derived from span_status,
        "span.kind" from span_kind) and for internal counter columns like
        dropped_attributes_count and flags that aren't meaningful to filter on.
      required:
        - key
        - type
        - value
      properties:
        filterLabel:
          type: string
        key:
          type: string
        type:
          type: string
        value:
          oneOf:
            - type: string
            - type: integer
              format: int64
            - type: number
            - type: boolean
          description: |-
            Value carries the tag's data. Its concrete JSON type (string,
            integer, number, or boolean) is declared by the sibling Type field.
    TracesResponse:
      type: object
      required:
        - data
        - total
        - limit
        - offset
      properties:
        data:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Trace'
        errors:
          type: string
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
    URL:
      type: object
      description: URL is a custom URL type that allows validation at configuration load time.
      required:
        - Scheme
        - Opaque
        - Host
        - Path
        - RawPath
        - OmitHost
        - ForceQuery
        - RawQuery
        - Fragment
        - RawFragment
      properties:
        ForceQuery:
          type: boolean
        Fragment:
          type: string
        Host:
          type: string
        OmitHost:
          type: boolean
        Opaque:
          type: string
        Path:
          type: string
        RawFragment:
          type: string
        RawPath:
          type: string
        RawQuery:
          type: string
        Scheme:
          type: string
        User:
          $ref: '#/components/schemas/net_url_Userinfo'
    UpdateApiKeyRequest:
      type: object
      required:
        - name
        - scopes
      properties:
        name:
          type: string
        roles:
          type: array
          nullable: true
          items:
            type: string
        scopes:
          type: array
          nullable: true
          items:
            type: string
    UpdateDatasetItemRequest:
      type: object
      description: |-
        UpdateDatasetItemRequest patches a dataset row. Omitted
        fields are left untouched.
      properties:
        expectedOutput: {}
        input: {}
        metadata: {}
        status:
          type: string
    UpdateDropRuleRequest:
      type: object
      description: UpdateDropRuleRequest is the request body for updating a drop rule.
      required:
        - rule_name
        - metric_name
        - filters
        - type
      properties:
        filters:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/MetricLabelMatcher'
        metric_name:
          $ref: '#/components/schemas/MetricLabelMatcher'
        rule_name:
          type: string
        type:
          type: string
    UpdateEvalTemplateRequest:
      type: object
      description: |-
        UpdateEvalTemplateRequest patches an evaluator. Empty fields
        are left untouched. Oodle-managed evaluators cannot be
        updated.
      properties:
        modelParams: {}
        name:
          type: string
        outputSchema: {}
        prompt:
          type: string
        sourceCode:
          type: string
        sourceCodeLanguage:
          type: string
        vars:
          type: array
          nullable: true
          items:
            type: string
    UpdateEvaluationRuleRequest:
      type: object
      description: |-
        UpdateEvaluationRuleRequest patches an evaluation rule.
        Pointer fields distinguish "not supplied" from a zero value.
      properties:
        dependsOnRuleIds:
          type: array
          nullable: true
          items:
            type: string
        enabled:
          type: boolean
          nullable: true
        filters: {}
        llmConnectionId:
          type: string
          nullable: true
        maxInvocationsPerHour:
          type: integer
          nullable: true
        modelParams: {}
        name:
          type: string
        samplingRate:
          type: number
          nullable: true
        targetType:
          type: string
        variableMapping: {}
    UpdateJobRequest:
      type: object
      description: |-
        UpdateJobRequest changes a job's status. Only cancellation is
        accepted over the API; workers own the other transitions.
      required:
        - status
      properties:
        error:
          type: string
        status:
          type: string
    UpdateLLMConnectionRequest:
      type: object
      description: |-
        UpdateLLMConnectionRequest patches a connection. An empty
        apiKey leaves the stored credential in place.
      properties:
        apiKey:
          type: string
        baseUrl:
          type: string
        customHeaders: {}
        customModels:
          type: array
          nullable: true
          items:
            type: string
        defaultModel:
          type: string
        defaultParams: {}
        enableDefaultModels:
          type: boolean
          nullable: true
        isDefault:
          type: boolean
        name:
          type: string
        provider:
          type: string
    UpdatePromptLabelsRequest:
      type: object
      description: |-
        UpdatePromptLabelsRequest replaces the label set on one
        prompt version.
      required:
        - version
        - labels
      properties:
        labels:
          type: array
          nullable: true
          items:
            type: string
        version:
          type: integer
    UpdatePromptVersionLabelsRequest:
      type: object
      description: |-
        UpdatePromptVersionLabelsRequest additively merges labels
        onto a version. "latest" is auto-managed and rejected here.
      required:
        - newLabels
      properties:
        newLabels:
          type: array
          nullable: true
          items:
            type: string
    UpdateUserRequest:
      type: object
      description: |-
        UpdateUserRequest is the request body for updating a
        user within the organization.
      required:
        - user_id
        - roles
      properties:
        roles:
          type: array
          nullable: true
          items:
            type: string
        user_id:
          type: string
    UpsertDatasetScheduleRequest:
      type: object
      description: |-
        UpsertDatasetScheduleRequest sets the one schedule a dataset
        may carry, replacing any existing one.

        The schedule describes *when* an experiment starts; what it
        runs is ExperimentConfig, the same `llm-experiment` job config
        `POST jobs` takes. `datasetId` is taken from the path, and
        `runName` is ignored: every fired run gets its own number.
      required:
        - enabled
        - experimentConfig
      properties:
        daysOfMonth:
          type: array
          description: |-
            DaysOfMonth are "1".."31"; empty means every day. With
            Weekdays also set, a day has to satisfy both.
          nullable: true
          items:
            type: string
        enabled:
          type: boolean
          description: Enabled false keeps the definition but stops it firing.
        experimentConfig:
          description: ExperimentConfig is the job config each run launches.
        intervalUnit:
          type: string
        intervalValue:
          type: integer
          description: |-
            IntervalValue and IntervalUnit describe an interval
            schedule: 30 + "minutes", 6 + "hours", 1 + "days". The
            period must be at least 5 minutes, which is what the
            worker's poll cycle can honour, and at most 365 days.
        mode:
          type: string
          description: |-
            Mode is "calendar" or "interval"; empty means calendar.

            The two answer different questions, and the fields below
            split along the same line. Calendar is for a run that has
            to land at a time of day someone cares about, and reads
            Timezone/Times/Weekdays/DaysOfMonth. Interval is for a run
            whose cadence matters but whose wall-clock time does not,
            and reads IntervalValue/IntervalUnit; a duration needs no
            timezone, so the calendar fields are ignored for it.
        times:
          type: array
          description: |-
            Times are "HH:MM" instants the experiment starts at. At
            least one is required in calendar mode.
          nullable: true
          items:
            type: string
        timezone:
          type: string
          description: |-
            Timezone is an IANA name; empty means UTC. The times below
            are read in it, so a schedule follows daylight saving
            rather than drifting by an hour twice a year.
        weekdays:
          type: array
          description: |-
            Weekdays are lowercase weekday names; empty means every
            day.
          nullable: true
          items:
            type: string
    User:
      type: object
      description: User is the API representation of an org user.
      required:
        - user_id
        - roles
      properties:
        email:
          type: string
        name:
          type: string
        picture:
          type: string
        roles:
          type: array
          nullable: true
          items:
            type: string
        user_id:
          type: string
    UserInvitation:
      type: object
      description: UserInvitation is the API representation of an invitation.
      required:
        - id
        - email
        - inviter
        - roles
        - expires_at
        - created_at
      properties:
        created_at:
          type: string
        email:
          type: string
        expires_at:
          type: string
        id:
          type: string
        inviter:
          type: string
        roles:
          type: array
          nullable: true
          items:
            type: string
    ValueExtractor:
      type: object
      description: ValueExtractor is used to extract label values from the log fields.
      properties:
        field:
          type: string
          description: Field is the name of the field in the log to extract the value from.
          nullable: true
        jsonPath:
          type: string
          description: |-
            JSONPath specifies a path to extract a nested value from a JSON field.
            If not set, the entire field value is used as the label value.
          nullable: true
        lookup:
          $ref: '#/components/schemas/Lookup'
        regex:
          type: string
          description: |-
            Regex is used to derive the label value by matching the
            regex pattern. Regex pattern should be a valid Rust regex, you can use
            https://rustexp.lpil.uk/ for trying out the pattern.
            If not set, the entire field value is used as the label value.
          nullable: true
    WebhookConfig:
      type: object
      description: WebhookConfig configures notifications via a generic webhook.
      required:
        - send_resolved
        - url
        - max_alerts
      properties:
        http_config:
          $ref: '#/components/schemas/HTTPClientConfig'
        max_alerts:
          type: integer
          description: |-
            MaxAlerts is the maximum number of alerts to be sent per webhook message.
            Alerts exceeding this threshold will be truncated. Setting this to 0
            allows an unlimited number of alerts.
        send_resolved:
          type: boolean
        url:
          type: string
          description: URL to send POST request to.
    integrationSetupSpecResponse:
      type: object
      additionalProperties: true
    integrationSetupSpecsListResponse:
      type: object
      additionalProperties: true
    net_url_Userinfo:
      type: object
      description: |-
        The Userinfo type is an immutable encapsulation of username and
        password details for a [URL]. An existing Userinfo value is guaranteed
        to have a username set (potentially empty, as allowed by RFC 2396),
        and optionally a password.
    oodle_api-server_apps_oauth_models_ProtectedResourceMetadataResponse:
      type: object
      description: |-
        ProtectedResourceMetadataResponse follows the OAuth protected resource
        metadata response shape used at well-known discovery endpoints.
      required:
        - resource
        - authorization_servers
      properties:
        authorization_servers:
          type: array
          nullable: true
          items:
            type: string
        bearer_methods_supported:
          type: array
          nullable: true
          items:
            type: string
        resource:
          type: string
        scopes_supported:
          type: array
          nullable: true
          items:
            type: string
    oodle_util_httputils_models_Error:
      type: object
      properties:
        cause:
          type: string
        code:
          type: string
        message:
          type: string
        oodleTraceId:
          type: string
        remedy:
          type: string
    oodle_util_httputils_models_Errors:
      type: object
      properties:
        errors:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/oodle_util_httputils_models_Error'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      description: API key for authentication. Create one in Oodle UI under Settings > API Keys.
      name: X-API-Key
      in: header
    OAuth2Auth:
      type: oauth2
      description: OAuth2 authentication using Authorization Code with PKCE. Discover the authorization server via GET /.well-known/oauth-protected-resource, then run the PKCE flow to obtain an access token. The easiest option is `oodle auth login` from the Oodle CLI.
      flows:
        authorizationCode:
          authorizationUrl: https://AUTH_SERVER/authorize
          tokenUrl: https://AUTH_SERVER/oauth/token
          scopes:
            email: User email address
            offline_access: Refresh token for long-lived sessions
            openid: OpenID Connect identity
            profile: User profile information
info:
  title: Oodle API
  description: |-
    The Oodle API provides programmatic access to your Oodle observability platform.

    All endpoints support authentication via an **API key** or an **OAuth2 Bearer token**.

    ## API Key Authentication

    Create an API key in the Oodle UI under **Settings > API Keys**, then pass it in every request:

    ```bash
    curl https://us1.api.oodle.ai/v1/api/monitors \
      -H 'X-API-Key: YOUR_API_KEY'
    ```

    ## OAuth2 Authentication

    Authenticate with OAuth2 using the [Oodle CLI](https://github.com/oodle-ai/oodle-cli):

    ```bash
    # Log in (opens browser)
    oodle auth login

    # Print the current OAuth2 access token
    oodle auth token
    ```

    Use the token in API requests:

    ```bash
    curl https://us1.api.oodle.ai/v1/api/monitors \
      -H "Authorization: Bearer $(oodle auth token)"
    ```

    The CLI handles token storage, refresh, and renewal automatically. Running `oodle auth token` returns a valid access token, refreshing it if needed.

    ### When to use which

    | Method | Best for |
    |--------|----------|
    | **API Key** | Scripts, CI pipelines, quick integrations |
    | **OAuth2** | CLI usage, integrations with token rotation, SSO-based access |

    ## Base URL

    Base URL varies by region:

    - `https://us1.api.oodle.ai` - US (default)
    - `https://ap1.api.oodle.ai` - AP1

    ## Finding your Instance ID

    Most endpoints require an Oodle **instance ID** (the `{instance}` path parameter, or the `OODLE-INSTANCE` / `X-OODLE-INSTANCE` header on query endpoints). You can find it in two ways:

    - **Oodle UI** (Admin users): open **Settings > API Keys**. The instance ID is shown alongside each key.
    - **Oodle CLI** (OAuth users): run `oodle auth status` after `oodle auth login`.
  version: 1.0.0
paths:
  /api/v1/log_index_patterns:
    get:
      tags:
        - Logs
      summary: List index patterns
      description: |-
        Returns the available log index patterns for the authenticated instance. Use the returned title as the index value in query_logs requests.

        **Required role:** Viewer, Editor, or Admin
      operationId: listLog_index_patterns
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndexPatternEntry'
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oodle_util_httputils_models_Errors'
        "502":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oodle_util_httputils_models_Errors'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oodle_util_httputils_models_Errors'
  /api/v1/query:
    get:
      tags:
        - Metrics
      summary: Instant query
      description: |-
        Evaluate a PromQL expression at a single point in time. Returns the current value of the expression. Compatible with the Prometheus /api/v1/query endpoint.

        **Required role:** Viewer, Editor, or Admin
      operationId: queryMetricsInstant
      parameters:
        - name: OODLE-INSTANCE
          in: header
          description: Oodle instance ID. See [Finding your Instance ID](/api#finding-your-instance-id) in the API overview.
          required: true
          schema:
            type: string
        - name: query
          in: query
          description: PromQL expression (e.g. sum(up))
          required: true
          schema:
            type: string
        - name: time
          in: query
          description: Evaluation timestamp in Unix seconds. Defaults to current time.
          schema:
            type: number
            format: double
      responses:
        "200":
          description: Successful query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrometheusQueryResponse'
        "400":
          description: Invalid query or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrometheusQueryResponse'
        "401":
          description: Missing or invalid API key
        "500":
          description: Internal server error
        default:
          description: ""
  /api/v1/query_logs:
    post:
      tags:
        - Logs
      summary: Query logs
      description: |-
        Search log data using the OpenSearch-compatible multi-search API. The request body uses NDJSON format with two JSON objects separated by a newline: the first selects the index, the second contains the search query using OpenSearch Query DSL.

        **Required role:** Viewer, Editor, or Admin
      operationId: queryLogs
      parameters:
        - name: X-OODLE-INSTANCE
          in: header
          description: Oodle instance ID. See [Finding your Instance ID](/api#finding-your-instance-id) in the API overview.
          required: true
          schema:
            type: string
      requestBody:
        description: 'Newline-delimited JSON (NDJSON) body with two lines: the first specifies the index (e.g. {"index": "logs-*"}), the second contains the OpenSearch Query DSL search body.'
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              description: 'Newline-delimited JSON (NDJSON) body with two lines: the first specifies the index (e.g. {"index": "logs-*"}), the second contains the OpenSearch Query DSL search body.'
      responses:
        "200":
          description: Successful query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsQueryResponse'
        "400":
          description: Invalid request body
        "401":
          description: Missing or invalid API key
        "500":
          description: Internal server error
        default:
          description: ""
  /api/v1/query_range:
    get:
      tags:
        - Metrics
      summary: Range query
      description: |-
        Evaluate a PromQL expression over a time range. Returns a time series of values. Compatible with the Prometheus /api/v1/query_range endpoint.

        **Required role:** Viewer, Editor, or Admin
      operationId: queryMetricsRange
      parameters:
        - name: OODLE-INSTANCE
          in: header
          description: Oodle instance ID. See [Finding your Instance ID](/api#finding-your-instance-id) in the API overview.
          required: true
          schema:
            type: string
        - name: query
          in: query
          description: PromQL expression (e.g. sum(up))
          required: true
          schema:
            type: string
        - name: start
          in: query
          description: Start timestamp in Unix seconds
          required: true
          schema:
            type: number
            format: double
        - name: end
          in: query
          description: End timestamp in Unix seconds
          required: true
          schema:
            type: number
            format: double
        - name: step
          in: query
          description: Query resolution step width as a duration string (e.g. 60s, 5m) or number of seconds
          required: true
          schema:
            type: string
        - name: partial_response
          in: query
          description: When true, return partial data if some stores are unavailable
          schema:
            type: boolean
      responses:
        "200":
          description: Successful query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrometheusQueryResponse'
        "400":
          description: Invalid query or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrometheusQueryResponse'
        "401":
          description: Missing or invalid API key
        "500":
          description: Internal server error
        default:
          description: ""
