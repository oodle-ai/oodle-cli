      type: object
      description: |-
        Tag represents a single key/value attribute attached to a Span,
        Process, or Log.

        FilterLabel is the fully-qualified storage-column name this tag was
        derived from (e.g. "span::http.method", "resource::k8s.cluster.name",
        "scope_name"). When set, clients can use it directly as a label name
        for trace filtering without having to guess which bucket (span vs
        resource) the attribute came from or which prefix to prepend.

        FilterLabel is empty for synthesised tags that don't correspond to a
        single indexed label (e.g. "otel.status_code" derived from span_status,
        "span.kind" from span_kind) and for internal counter columns like
        dropped_attributes_count and flags that aren't meaningful to filter on.
      required:
        - key
        - type
        - value
      properties:
        filterLabel:
          type: string
        key:
          type: string
        type:
          type: string
        value:
          oneOf:
            - type: string
            - type: integer
              format: int64
            - type: number
            - type: boolean
          description: |-
            Value carries the tag's data. Its concrete JSON type (string,
            integer, number, or boolean) is declared by the sibling Type field.
    TracesResponse:
      type: object
      required:
        - data
        - total
        - limit
        - offset
      properties:
        data:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Trace'
        errors:
          type: string
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
    URL:
      type: object
      description: URL is a custom URL type that allows validation at configuration load time.
      required:
        - Scheme
        - Opaque
        - Host
        - Path
        - RawPath
        - OmitHost
        - ForceQuery
        - RawQuery
        - Fragment
        - RawFragment
      properties:
        ForceQuery:
          type: boolean
        Fragment:
          type: string
        Host:
          type: string
        OmitHost:
          type: boolean
        Opaque:
          type: string
        Path:
          type: string
        RawFragment:
          type: string
        RawPath:
          type: string
        RawQuery:
          type: string
        Scheme:
          type: string
        User:
          $ref: '#/components/schemas/net_url_Userinfo'
    UpdateDropRuleRequest:
      type: object
      description: UpdateDropRuleRequest is the request body for updating a drop rule.
      required:
        - rule_name
        - metric_name
        - filters
        - type
      properties:
        filters:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/MetricLabelMatcher'
        metric_name:
          $ref: '#/components/schemas/MetricLabelMatcher'
        rule_name:
          type: string
        type:
          type: string
    User:
      type: object
      description: User is the API representation of an org user.
      required:
        - user_id
      properties:
        email:
          type: string
        name:
          type: string
        picture:
          type: string
        user_id:
          type: string
    UserInvitation:
      type: object
      description: UserInvitation is the API representation of an invitation.
      required:
        - id
        - email
        - inviter
        - roles
        - expires_at
        - created_at
      properties:
        created_at:
          type: string
        email:
          type: string
        expires_at:
          type: string
        id:
          type: string
        inviter:
          type: string
        roles:
          type: array
          nullable: true
          items:
            type: string
    ValueExtractor:
      type: object
      description: ValueExtractor is used to extract label values from the log fields.
      properties:
        field:
          type: string
          description: Field is the name of the field in the log to extract the value from.
          nullable: true
        jsonPath:
          type: string
          description: |-
            JSONPath specifies a path to extract a nested value from a JSON field.
            If not set, the entire field value is used as the label value.
          nullable: true
        lookup:
          $ref: '#/components/schemas/Lookup'
        regex:
          type: string
          description: |-
            Regex is used to derive the label value by matching the
            regex pattern. Regex pattern should be a valid Rust regex, you can use
            https://rustexp.lpil.uk/ for trying out the pattern.
            If not set, the entire field value is used as the label value.
          nullable: true
    WebhookConfig:
      type: object
      description: WebhookConfig configures notifications via a generic webhook.
      required:
        - send_resolved
        - url
        - max_alerts
      properties:
        http_config:
          $ref: '#/components/schemas/HTTPClientConfig'
        max_alerts:
          type: integer
          description: |-
            MaxAlerts is the maximum number of alerts to be sent per webhook message.
            Alerts exceeding this threshold will be truncated. Setting this to 0
            allows an unlimited number of alerts.
        send_resolved:
          type: boolean
        url:
          type: string
          description: URL to send POST request to.
    net_url_Userinfo:
      type: object
      description: |-
        The Userinfo type is an immutable encapsulation of username and
        password details for a [URL]. An existing Userinfo value is guaranteed
        to have a username set (potentially empty, as allowed by RFC 2396),
        and optionally a password.
    oodle_util_httputils_models_Error:
      type: object
      properties:
        cause:
          type: string
        code:
          type: string
        message:
          type: string
        oodleTraceId:
          type: string
        remedy:
          type: string
    oodle_util_httputils_models_Errors:
      type: object
      properties:
        errors:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/oodle_util_httputils_models_Error'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      description: API key for authentication. Create one in Oodle UI under Settings > API Keys.
      name: X-API-Key
      in: header
info:
  title: Oodle API
  description: |-
    The Oodle API provides programmatic access to your Oodle observability platform.

    All endpoints require authentication via an API key passed in the `X-API-Key` header.
    You can create API keys in the Oodle UI under Settings > API Keys.

    Base URL varies by region:

    - `https://us1.api.oodle.ai` — US (default)
    - `https://ap1.api.oodle.ai` — AP1
  version: 1.0.0
paths:
  /api/v1/log_index_patterns:
    get:
      tags:
        - Logs
      summary: List index patterns
      description: Returns the available log index patterns for the authenticated instance. Use the returned title as the index value in query_logs requests.
      operationId: listLog_index_patterns
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndexPatternEntry'
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oodle_util_httputils_models_Errors'
        "502":
          description: ""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oodle_util_httputils_models_Errors'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oodle_util_httputils_models_Errors'
  /api/v1/query:
    get:
      tags:
        - Metrics
      summary: Instant query
      description: Evaluate a PromQL expression at a single point in time. Returns the current value of the expression. Compatible with the Prometheus /api/v1/query endpoint.
      operationId: queryMetricsInstant
      parameters:
        - name: OODLE-INSTANCE
          in: header
          description: Oodle instance ID
          required: true
          schema:
            type: string
        - name: query
          in: query
          description: PromQL expression (e.g. sum(up))
          required: true
          schema:
            type: string
        - name: time
          in: query
          description: Evaluation timestamp in Unix seconds. Defaults to current time.
          schema:
            type: number
            format: double
      responses:
        "200":
          description: Successful query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrometheusQueryResponse'
        "400":
          description: Invalid query or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrometheusQueryResponse'
        "401":
          description: Missing or invalid API key
        "500":
          description: Internal server error
        default:
          description: ""
  /api/v1/query_logs:
    post:
      tags:
        - Logs
      summary: Query logs
      description: 'Search log data using the OpenSearch-compatible multi-search API. The request body uses NDJSON format with two JSON objects separated by a newline: the first selects the index, the second contains the search query using OpenSearch Query DSL.'
      operationId: queryLogs
      parameters:
        - name: X-OODLE-INSTANCE
          in: header
          description: Oodle instance ID
          required: true
          schema:
            type: string
      requestBody:
        description: 'Newline-delimited JSON (NDJSON) body with two lines: the first specifies the index (e.g. {"index": "logs-*"}), the second contains the OpenSearch Query DSL search body.'
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              description: 'Newline-delimited JSON (NDJSON) body with two lines: the first specifies the index (e.g. {"index": "logs-*"}), the second contains the OpenSearch Query DSL search body.'
      responses:
        "200":
          description: Successful query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsQueryResponse'
        "400":
          description: Invalid request body
        "401":
          description: Missing or invalid API key
        "500":
          description: Internal server error
        default:
          description: ""
  /api/v1/query_range:
    get:
      tags:
        - Metrics
      summary: Range query
      description: Evaluate a PromQL expression over a time range. Returns a time series of values. Compatible with the Prometheus /api/v1/query_range endpoint.
      operationId: queryMetricsRange
      parameters:
        - name: OODLE-INSTANCE
          in: header
          description: Oodle instance ID
          required: true
          schema:
            type: string
        - name: query
          in: query
          description: PromQL expression (e.g. sum(up))
          required: true
          schema:
            type: string
        - name: start
          in: query
          description: Start timestamp in Unix seconds
          required: true
          schema:
            type: number
            format: double
        - name: end
          in: query
          description: End timestamp in Unix seconds
          required: true
          schema:
            type: number
            format: double
        - name: step
          in: query
          description: Query resolution step width as a duration string (e.g. 60s, 5m) or number of seconds
          required: true
          schema:
            type: string
        - name: partial_response
          in: query
          description: When true, return partial data if some stores are unavailable
          schema:
            type: boolean
      responses:
        "200":
          description: Successful query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrometheusQueryResponse'
        "400":
          description: Invalid query or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrometheusQueryResponse'
        "401":
          description: Missing or invalid API key
        "500":
          description: Internal server error
        default:
          description: ""
