        targetType:
          type: string
        updatedAt:
          type: string
        variableMapping: {}
    EvaluationRuleResponse:
      type: object
      description: |-
        EvaluationRuleResponse is one evaluator, joined with the type
        of the template it points at.

        EvaluatorType is the only field the store type cannot carry:
        it lives on the template, and a rule referencing an
        Oodle-managed template has no template row to read it from.
        Clients split output comparers out of the evaluator list with
        it.
      required:
        - id
        - evaluatorId
        - name
        - targetType
        - filters
        - samplingRate
        - maxInvocationsPerHour
        - variableMapping
        - modelParams
        - enabled
        - createdAt
        - updatedAt
      properties:
        createdAt:
          type: string
        datasetId:
          type: string
        dependsOnRuleIds:
          type: array
          nullable: true
          items:
            type: string
        enabled:
          type: boolean
        evaluatorId:
          type: string
        evaluatorType:
          type: string
          description: |-
            EvaluatorType is "llm", "code" or "output_comparer", and
            is empty when the referenced template no longer exists.
        filters: {}
        id:
          type: string
        llmConnectionId:
          type: string
          nullable: true
        maxInvocationsPerHour:
          type: integer
        modelParams: {}
        name:
          type: string
        samplingRate:
          type: number
        targetType:
          type: string
        updatedAt:
          type: string
        variableMapping: {}
    Folder:
      type: object
      description: Folder represents a Grafana folder
      required:
        - id
        - uid
        - title
      properties:
        created:
          type: string
        id:
          type: integer
        parentUid:
          type: string
        title:
          type: string
        uid:
          type: string
        updated:
          type: string
        url:
          type: string
        version:
          type: integer
    GetDashboardResponse:
      type: object
      properties:
        dashboard:
          type: object
          description: Grafana-compatible dashboard JSON
        meta:
          type: object
          properties:
            created:
              type: string
            folderId:
              type: integer
            folderTitle:
              type: string
            folderUid:
              type: string
            slug:
              type: string
            updated:
              type: string
            url:
              type: string
            version:
              type: integer
    GoogleChatConfig:
      type: object
      description: GoogleChatConfig configures notifications via Google Chat.
      required:
        - send_resolved
      properties:
        card_actions:
          type: string
        card_details:
          type: string
        card_image_url:
          type: string
        card_message:
          type: string
        card_subtitle:
          type: string
        card_title:
          type: string
        http_config:
          $ref: '#/components/schemas/HTTPClientConfig'
        message:
          type: string
        send_resolved:
          type: boolean
        threading:
          type: boolean
        url:
          type: string
    Grouping:
      type: object
      description: Grouping is a model for grouping alerts.
      properties:
        by_labels:
          type: array
          nullable: true
          items:
            type: string
        by_monitor:
          type: boolean
        disabled:
          type: boolean
    HTTPClientConfig:
      type: object
      description: HTTPClientConfig configures an HTTP client.
      required:
        - follow_redirects
        - enable_http2
      properties:
        authorization:
          $ref: '#/components/schemas/Authorization'
        basic_auth:
          $ref: '#/components/schemas/BasicAuth'
        bearer_token:
          type: string
          description: |-
            The bearer token for the targets. Deprecated in favour of
            Authorization.Credentials.
        bearer_token_file:
          type: string
          description: |-
            The bearer token file for the targets. Deprecated in favour of
            Authorization.CredentialsFile.
        enable_http2:
          type: boolean
          description: |-
            EnableHTTP2 specifies whether the client should configure HTTP2.
            The omitempty flag is not set, because it would be hidden from the
            marshalled configuration when set to false.
        follow_redirects:
          type: boolean
          description: |-
            FollowRedirects specifies whether the client should follow HTTP 3xx redirects.
            The omitempty flag is not set, because it would be hidden from the
            marshalled configuration when set to false.
        http_headers:
          $ref: '#/components/schemas/Headers'
        no_proxy:
          type: string
          description: NoProxy contains addresses that should not use a proxy.
        oauth2:
          $ref: '#/components/schemas/OAuth2'
        proxy_connect_header:
          type: object
          description: |-
            ProxyConnectHeader optionally specifies headers to send to
            proxies during CONNECT requests. Assume that at least _some_ of
            these headers are going to contain secrets and use Secret as the
            value type instead of string.
          nullable: true
          additionalProperties:
            type: array
            nullable: true
            items:
              type: string
        proxy_from_environment:
          type: boolean
          description: |-
            ProxyFromEnvironment makes use of net/http ProxyFromEnvironment function
            to determine proxies.
        tls_config:
          $ref: '#/components/schemas/TLSConfig'
    Header:
      type: object
      description: Header represents the configuration for a single HTTP header.
      properties:
        files:
          type: array
          nullable: true
          items:
            type: string
        secrets:
          type: array
          nullable: true
          items:
            type: string
        values:
          type: array
          nullable: true
          items:
            type: string
    Headers:
      type: object
      description: Headers represents the configuration for HTTP headers.
      required:
        - Headers
      properties:
        Headers:
          type: object
          nullable: true
          additionalProperties:
            type: string
    IndexPatternEntry:
      type: object
      description: |-
        IndexPatternEntry is the public response shape
        for GET /api/v1/log_index_patterns.
      required:
        - id
        - title
        - fields
      properties:
        fields:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/IndexPatternField'
        id:
          type: string
        title:
          type: string
    IndexPatternField:
      type: object
      description: |-
        IndexPatternField is a single field in an index
        pattern, exposing only name and type.
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
    Instance:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
    Integration:
      type: object
      properties:
        apiDomain:
          type: string
        areMonitorsInstalled:
          type: boolean
        categories:
          type: array
          nullable: true
          items:
            type: string
        collectorDomain:
          type: string
        createdAt:
          type: string
          format: date-time
        deploymentDomain:
          type: string
        description:
          type: string
        docLink:
          type: string
        expectedConnectionTimeInMins:
          type: integer
        id:
          type: string
        logsCollectorDomain:
          type: string
        name:
          type: string
        otlpCollectorDomain:
          type: string
        status:
          type: string
        statusPerSignal:
          type: object
          nullable: true
          additionalProperties:
            type: string
        type:
          type: string
        typeSpecificData:
          oneOf:
            - $ref: '#/components/schemas/CloudWatchMetricPullIntegrationWrapper'
            - $ref: '#/components/schemas/ConfluentCloudIntegrationWrapper'
            - type: object
              description: Type-specific config for integration variants not yet typed in this spec (Grafana, GCP, CloudWatch dashboard, S3 log pull). Shape depends on the parent `type` field; consult the backend models for the variant in use.
              additionalProperties: true
        updatedAt:
          type: string
          format: date-time
    Job:
      type: object
      required:
        - id
        - type
        - status
        - config
        - createdAt
        - updatedAt
      properties:
        config: {}
        createdAt:
          type: string
        datasetRunId:
          type: string
        error:
          type: string
        id:
          type: string
        status:
          type: string
        type:
          type: string
        updatedAt:
          type: string
    LLMConnection:
      type: object
      required:
        - id
        - name
        - provider
        - defaultModel
        - baseUrl
        - defaultParams
        - isDefault
        - customModels
        - enableDefaultModels
        - createdAt
        - updatedAt
      properties:
        baseUrl:
          type: string
        createdAt:
          type: string
        customHeaders: {}
        customModels:
          type: array
          nullable: true
          items:
            type: string
        defaultModel:
          type: string
        defaultParams: {}
        enableDefaultModels:
          type: boolean
        id:
          type: string
        isDefault:
          type: boolean
        name:
          type: string
        provider:
          type: string
        updatedAt:
          type: string
    Label:
      type: object
      description: Label represents a name-value pair for a metric label.
      properties:
        name:
          type: string
          description: Name is the name of the label.
        value:
          type: string
          description: |-
            Value is the static value of the label.
            Only one of Value or ValueExtractor should be set.
          nullable: true
        valueExtractor:
          $ref: '#/components/schemas/ValueExtractor'
    LabelMatcher:
      type: object
      required:
        - type
        - name
        - value
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/MatchType'
        value:
          type: string
    LabelMatcherNotifications:
      type: object
      description: |-
        LabelMatcherNotifications defines a notification policy that is applied when
        alert labels match the specified matchers.
      required:
        - matchers
      properties:
        matchers:
          type: array
          description: Matchers are the label matchers that determine when this policy applies
          nullable: true
          items:
            $ref: '#/components/schemas/LabelMatcher'
        notification_policy_id:
          type: string
          format: uuid
          description: NotificationPolicyID references the notification policy to use when labels match
        notifiers:
          $ref: '#/components/schemas/NotifiersByCondition'
    ListDatasetItemsResponse:
      type: object
      description: ListDatasetItemsResponse is the dataset item list envelope.
      required:
        - data
        - meta
      properties:
        data:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/DatasetItem'
        meta:
          $ref: '#/components/schemas/ListMeta'
    ListDatasetRunItemsResponse:
      type: object
      description: ListDatasetRunItemsResponse is the run item list envelope.
      required:
        - data
        - meta
      properties:
        data:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/DatasetRunItemResponse'
        meta:
          $ref: '#/components/schemas/ListMeta'
    ListDatasetRunsResponse:
      type: object
      description: ListDatasetRunsResponse is the experiment run list envelope.
      required:
        - data
        - meta
      properties:
        data:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/DatasetRunResponse'
        meta:
          $ref: '#/components/schemas/ListMeta'
    ListDatasetsResponse:
      type: object
      description: ListDatasetsResponse is the dataset list envelope.
      required:
        - data
        - meta
      properties:
        data:
          type: array
          nullable: true
