security:
  - OAuth2Auth: []
  - ApiKeyAuth: []
servers:
  - url: https://us1.api.oodle.ai
    description: US region (default)
  - url: https://ap1.api.oodle.ai
    description: AP1 region
tags:
  - name: Monitors
    description: Create and manage alert monitors that evaluate PromQL expressions.
  - name: Notifiers
    description: Configure notification channels (Slack, PagerDuty, email, webhooks).
  - name: Notification Policies
    description: Route alerts to the appropriate notifiers based on label matchers.
  - name: Muting Rules
    description: Suppress alert notifications during maintenance windows.
  - name: Log Metrics
    description: Define metrics derived from log data (counters, gauges, histograms).
  - name: Synthetic Monitors
    description: HTTP, ping, DNS, TCP, SSL, and traceroute uptime checks.
  - name: Users
    description: Manage users and invitations for your Oodle organization.
  - name: API Keys
    description: Create and manage API keys for programmatic access.
  - name: Metric Drop Rules
    description: Drop high-cardinality metric series to control costs.
  - name: Dashboards
    description: Manage Grafana-compatible metric dashboards.
  - name: Dashboard Folders
    description: Organize dashboards into folders.
  - name: Traces
    description: Query distributed traces, labels, and label values.
  - name: Metrics
    description: Query metric names, labels, label values, and execute PromQL queries (Prometheus-compatible).
  - name: Logs
    description: Search and query log data, and discover log index patterns.
  - name: OAuth
    description: OAuth well-known discovery metadata.
  - name: Integrations
    description: Integration setup specifications for programmatic onboarding.
  - name: Org
    description: Organization details and associated instances.
  - name: GenAI Prompts
    description: Version, label, and fetch prompts. Labels (`production`, `latest`, or your own) are how an application pins which version it runs.
  - name: GenAI Datasets
    description: Curate evaluation datasets and their items. Items can be authored directly or captured from a production trace.
  - name: GenAI Evaluators
    description: Define LLM-as-judge and code evaluators, and the rules that run them over live traffic.
  - name: GenAI Scores
    description: Read evaluator output and attach your own scores to traces and observations.
  - name: GenAI Experiments
    description: Run a prompt over a dataset, score the result, and compare runs.
  - name: GenAI LLM Connections
    description: Provider credentials that evaluators and experiments run against. Stored keys are encrypted and never returned.
